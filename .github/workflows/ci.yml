name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: make setup
      - run: make lint
      - run: make test
      - run: make eval
      - uses: actions/setup-node@v4
        if: hashFiles('ui/package-lock.json') != ''
        with:
          node-version: '22'
      - run: make frontend-test && make frontend-build
        if: hashFiles('ui/package-lock.json') != ''
